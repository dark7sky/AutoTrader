services:
  app:
    build:
      context: .
      target: test
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
    command: ["python", "-m", "pytest"]
    profiles: ["test"]
    healthcheck:
      test: ["CMD", "python", "-c", "import kis_ai_scalper"]
      interval: 30s
      timeout: 5s
      retries: 3
  smoke-kis:
    build:
      context: .
      target: runtime
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      KIS_ENV: "${KIS_ENV:-demo}"
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: ["python", "-m", "kis_ai_scalper.cli", "smoke-kis", "--config", "config/settings.yaml", "--env", "${KIS_ENV:-demo}", "--symbol", "005930"]
    profiles: ["smoke"]
  smoke-ws:
    build:
      context: .
      target: runtime
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      KIS_ENV: "${KIS_ENV:-demo}"
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: ["python", "-m", "kis_ai_scalper.cli", "smoke-ws", "--config", "config/settings.yaml", "--env", "${KIS_ENV:-demo}", "--symbol", "005930", "--seconds", "10"]
    profiles: ["smoke"]
  smoke-fill-notice:
    build:
      context: .
      target: runtime
    environment:
      LIVE_TRADING_ENABLED: "false"
      KIS_ENV: "${KIS_ENV:-demo}"
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: ["python", "-m", "kis_ai_scalper.cli", "smoke-fill-notice", "--config", "config/settings.yaml", "--env", "${KIS_ENV:-demo}", "--seconds", "10"]
    profiles: ["smoke"]
  collector:
    build:
      context: .
      target: runtime
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      KIS_ENV: "${KIS_ENV:-demo}"
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: ["python", "-m", "kis_ai_scalper.cli", "collect-market", "--config", "config/settings.yaml", "--env", "${KIS_ENV:-demo}", "--symbol", "005930", "--seconds", "60", "--db", "data/kis_ai_scalper.sqlite3"]
    profiles: ["tools"]
  telegram-poll:
    build:
      context: .
      target: runtime
    profiles: ["ops"]
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: ["python", "-m", "kis_ai_scalper.cli", "telegram-poll", "--db", "data/kis_ai_scalper.sqlite3", "--limit", "10", "--timeout-seconds", "5"]
  auto-trade-cycle:
    build:
      context: .
      target: runtime
    profiles: ["trade"]
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      KIS_ENV: "${KIS_ENV:-demo}"
    volumes:
      - ./.env:/app/.env:ro
      - ${DATA_DIR:-./data}:/app/data
    command: [
      "python", "-m", "kis_ai_scalper.cli", "auto-trade-cycle",
      "--config", "config/settings.yaml",
      "--env", "${KIS_ENV:-demo}",
      "--db", "data/kis_ai_scalper.sqlite3",
      "--ai", "${AUTO_TRADE_AI:-openai}",
      "--max-quantity", "${AUTO_TRADE_MAX_QUANTITY:-1}",
      "--collect-seconds", "${AUTO_TRADE_COLLECT_SECONDS:-10}",
      "--notify-telegram",
      "--confirm", "AUTO_TRADE"
    ]
  trading-service:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      LIVE_TRADING_ENABLED: "${LIVE_TRADING_ENABLED:-false}"
      KIS_DEMO_APP_KEY: "${KIS_DEMO_APP_KEY:-}"
      KIS_DEMO_APP_SECRET: "${KIS_DEMO_APP_SECRET:-}"
      KIS_DEMO_ACCOUNT_NO: "${KIS_DEMO_ACCOUNT_NO:-}"
      KIS_DEMO_ACCOUNT_PRODUCT_CODE: "${KIS_DEMO_ACCOUNT_PRODUCT_CODE:-01}"
      KIS_REAL_APP_KEY: "${KIS_REAL_APP_KEY:-}"
      KIS_REAL_APP_SECRET: "${KIS_REAL_APP_SECRET:-}"
      KIS_REAL_ACCOUNT_NO: "${KIS_REAL_ACCOUNT_NO:-}"
      KIS_REAL_ACCOUNT_PRODUCT_CODE: "${KIS_REAL_ACCOUNT_PRODUCT_CODE:-01}"
      KIS_HTS_ID: "${KIS_HTS_ID:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_CHAT_ID: "${TELEGRAM_ALLOWED_CHAT_ID:-}"
      TELEGRAM_ALLOWED_USER_ID: "${TELEGRAM_ALLOWED_USER_ID:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      OPENAI_ADMIN_KEY: "${OPENAI_ADMIN_KEY:-}"
      OPENAI_USAGE_API_KEY: "${OPENAI_USAGE_API_KEY:-}"
      OPENAI_MAX_PROCESS_CALLS: "${OPENAI_MAX_PROCESS_CALLS:-500}"
      OPENAI_MAX_DAILY_CALLS: "${OPENAI_MAX_DAILY_CALLS:-1000}"
      OPENAI_MAX_PROCESS_COST_USD: "${OPENAI_MAX_PROCESS_COST_USD:-10.0}"
      OPENAI_MAX_DAILY_COST_USD: "${OPENAI_MAX_DAILY_COST_USD:-25.0}"
      OPENAI_MAX_RESPONSE_AGE_SECONDS: "${OPENAI_MAX_RESPONSE_AGE_SECONDS:-20}"
      OPENAI_TIMEOUT_SECONDS: "${OPENAI_TIMEOUT_SECONDS:-8}"
      OPENAI_MAX_RETRIES: "${OPENAI_MAX_RETRIES:-1}"
      AUTO_TRADE_AI: "${AUTO_TRADE_AI:-openai}"
      AUTO_TRADE_MAX_QUANTITY: "${AUTO_TRADE_MAX_QUANTITY:-1}"
      AUTO_TRADE_DECISION_DEADLINE_SECONDS: "${AUTO_TRADE_DECISION_DEADLINE_SECONDS:-25}"
      AUTO_TRADE_COLLECT_SECONDS: "${AUTO_TRADE_COLLECT_SECONDS:-10}"
      AUTO_TRADE_CYCLE_INTERVAL_SECONDS: "${AUTO_TRADE_CYCLE_INTERVAL_SECONDS:-20}"
      AUTO_TRADE_ALLOCATED_KRW: "${AUTO_TRADE_ALLOCATED_KRW:-3000000}"
      RISK_PER_TRADE_PCT: "${RISK_PER_TRADE_PCT:-0.3}"
      MAX_POSITION_PCT: "${MAX_POSITION_PCT:-10}"
      MAX_TOTAL_EXPOSURE_PCT: "${MAX_TOTAL_EXPOSURE_PCT:-20}"
      MAX_POSITIONS: "${MAX_POSITIONS:-2}"
      MAX_DAILY_LOSS_PCT: "${MAX_DAILY_LOSS_PCT:-1.0}"
      CONSECUTIVE_LOSS_LIMIT: "${CONSECUTIVE_LOSS_LIMIT:-3}"
      MAX_TRADES_PER_DAY: "${MAX_TRADES_PER_DAY:-10}"
      MAX_ORDERS_PER_SYMBOL: "${MAX_ORDERS_PER_SYMBOL:-3}"
      AI_MIN_CONFIDENCE: "${AI_MIN_CONFIDENCE:-0.75}"
      MARKET_TICK_RETENTION_DAYS: "${MARKET_TICK_RETENTION_DAYS:-7}"
      MARKET_BAR_RETENTION_DAYS: "${MARKET_BAR_RETENTION_DAYS:-365}"
      BUY_ORDER_TTL_SECONDS: "${BUY_ORDER_TTL_SECONDS:-60}"
      SELL_ORDER_TTL_SECONDS: "${SELL_ORDER_TTL_SECONDS:-30}"
      ORDER_SUPERVISOR_INTERVAL_SECONDS: "${ORDER_SUPERVISOR_INTERVAL_SECONDS:-5}"
      SERVICE_HEARTBEAT_MAX_AGE_SECONDS: "${SERVICE_HEARTBEAT_MAX_AGE_SECONDS:-180}"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    healthcheck:
      test: [
        "CMD", "python", "-m", "kis_ai_scalper.ops.healthcheck",
        "--db", "data/kis_ai_scalper.sqlite3",
        "--component", "trading-service",
        "--max-age-seconds", "${SERVICE_HEARTBEAT_MAX_AGE_SECONDS:-180}"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    command: [
      "python", "-m", "kis_ai_scalper.cli", "service-loop",
      "--config", "config/settings.yaml",
      "--db", "data/kis_ai_scalper.sqlite3",
      "--ai", "${AUTO_TRADE_AI:-openai}",
      "--max-quantity", "${AUTO_TRADE_MAX_QUANTITY:-1}",
      "--collect-seconds", "${AUTO_TRADE_COLLECT_SECONDS:-10}",
      "--cycle-interval-seconds", "${AUTO_TRADE_CYCLE_INTERVAL_SECONDS:-20}"
    ]
